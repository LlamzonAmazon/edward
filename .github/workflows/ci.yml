name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock/package-lock.json
      - name: Build the page
        run: make mock web
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal skill)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Shell syntax
        run: sh -n install.sh && sh -n uninstall.sh
      - name: Release build
        run: make release
